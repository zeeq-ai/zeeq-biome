<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biome · Logo studies</title>
<style>
:root{color-scheme:light;--bg:#faf9f7;--panel:#fff;--fg:#24212a;--muted:#77707e;--line:#e8e3e9;--ink:#c026d3;--accent:#e879f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}body.dark{color-scheme:dark;--bg:#141118;--panel:#1d1922;--fg:#f5eef8;--muted:#ada1b7;--line:#372e3f;--ink:#c026d3;--accent:#e879f9}body.mono{--ink:var(--fg);--accent:var(--fg);--leaf:var(--fg)!important}body.mono .study{--leaf:var(--fg)!important}main{max-width:1180px;margin:auto;padding:44px 32px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:30px;font-weight:650;letter-spacing:-1px;margin:6px 0}p{color:var(--muted);margin:0}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap}button{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}button[aria-pressed=true]{border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}.study{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}.tag{font-size:12px;letter-spacing:.4px;color:var(--muted)}h2{font-size:19px;margin:4px 0 0;font-weight:600}.hero{height:232px;display:grid;place-items:center}.hero svg{width:170px;height:170px}.ink{color:var(--ink)}.samples{display:flex;align-items:center;justify-content:center;gap:26px;padding:18px 0;border-top:1px solid var(--line)}.sample svg{display:block}.wordmark{display:flex;align-items:center;justify-content:center;gap:9px;padding:24px 0 15px;font-size:20px;font-weight:700;letter-spacing:-.6px}.wordmark svg{width:30px;height:30px}.wordmark em{font-style:normal;color:var(--ink)}.caption{min-height:48px;margin-top:18px;font-size:13px}.baseline{margin-top:28px;border-top:1px solid var(--line);padding-top:24px;display:flex;align-items:center;gap:18px}.baseline img{height:54px;width:54px}.baseline strong{font-size:13px}footer{margin-top:22px;color:var(--muted);font-size:12px}.defs{position:absolute;width:0;height:0;overflow:hidden}@media(max-width:780px){main{padding:24px 18px}.grid{grid-template-columns:1fr}.hero{height:200px}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<svg class="defs" xmlns="http://www.w3.org/2000/svg"><defs>
<!-- Shared solid fuchsia B with green leaves. -->
<symbol id="solid" viewBox="0 0 72 72">
<path d="M25 10V62" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
<path d="M25 10C45 5 59 17 52 28C47 36 35 37 25 33Z M25 35C48 29 63 43 54 56C48 64 35 65 25 60Z" fill="currentColor"/>
<path d="M25 40C13 42 6 34 7 23C19 23 25 29 25 40Z" fill="var(--leaf)"/>
</symbol>
<symbol id="green-loops" viewBox="0 0 72 72">
<path d="M25 10V62" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
<path d="M25 10C45 5 59 17 52 28C47 36 35 37 25 33Z M25 35C48 29 63 43 54 56C48 64 35 65 25 60Z M25 40C13 42 6 34 7 23C19 23 25 29 25 40Z" fill="var(--leaf)"/>
<path d="M25 10V62" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
</symbol>
<symbol id="inset" viewBox="0 0 72 72">
<use href="#solid"/>
<path d="M31 29C30 17 38 12 47 14C46 25 40 30 31 29Z M31 55C30 42 40 36 51 39C49 51 42 57 31 55Z" fill="var(--leaf)"/>
</symbol>
</defs></svg>
<main>
<header><div><div class="eyebrow">Zeeq Biome / Color exploration</div><h1>Solid fuchsia. Fresh green.</h1><p>Three ways to balance the B and the leaves.</p></div><div class="controls"><button id="theme" aria-pressed="false">Dark background</button><button id="mono" aria-pressed="false">One color</button></div></header>
<div class="grid" id="studies"></div>
<div class="baseline"><img src="logo.svg" alt="Current logo"><div><strong>Current logo</strong><p>Separate B + sprig</p></div></div>
<footer>Fuchsia #C026D3 · Green #65A30D · Each mark shown at 170, 48, 28, and 16 pixels</footer>
</main>
<script>
const variants=[['solid','01 / A','Fuchsia B + green leaf','A solid fuchsia B, with the opposite leaf in green.'],['green-loops','02 / B','Green leaf loops','All three leaves in green, joined by a solid fuchsia branch.'],['inset','03 / C','Green within fuchsia','A solid fuchsia B with green leaf shapes inside its loops.']];
function mark(id,size){return `<svg class="ink" width="${size}" height="${size}" viewBox="0 0 72 72" role="img" aria-label="${id}: solid fuchsia B with green leaves"><use href="#${id}"/></svg>`}
document.getElementById('studies').innerHTML=variants.map(([id,tag,title,caption])=>`<section class="study" style="--leaf:#65a30d"><div class="tag">${tag}</div><h2>${title}</h2><div class="hero">${mark(id,170)}</div><div class="samples">${[48,28,16].map(size=>`<span class="sample">${mark(id,size)}</span>`).join('')}</div><div class="wordmark">${mark(id,30)}<span>Zeeq <em>Biome</em></span></div><p class="caption">${caption}</p></section>`).join('');
document.getElementById('theme').onclick=function(){const on=document.body.classList.toggle('dark');this.setAttribute('aria-pressed',on);this.textContent=on?'Light background':'Dark background'};
document.getElementById('mono').onclick=function(){const on=document.body.classList.toggle('mono');this.setAttribute('aria-pressed',on)};
</script>
</body>
</html>
