# Reusable workflow: statically generates the documentation site (docs/) with
# Nuxt, using the Node and pnpm versions pinned in docs/.nvmrc and
# docs/package.json. Called by ci.yml (build check only) and docs-deploy.yml
# (build, then publish to GitHub Pages).

name: Docs build

on:
  workflow_call:
    inputs:
      upload:
        description: Upload the generated site as the GitHub Pages artifact
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The pnpm version comes from the packageManager field in docs/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Pages serves this repository under /zeeq-biome/.
      - name: Generate static site
        run: pnpm run generate
        env:
          NUXT_APP_BASE_URL: /zeeq-biome/
          NUXT_PUBLIC_SITE_URL: https://zeeq-ai.github.io

      - name: Upload Pages artifact
        if: inputs.upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.output/public
