name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Restore dependencies
        run: dotnet restore zeeq-biome.slnx

      - name: Build Release
        run: dotnet build zeeq-biome.slnx -c Release --no-restore -warnaserror

      - name: Run tests
        run: dotnet test --solution zeeq-biome.slnx -c Release --no-build

      - name: Pack smoke test
        run: dotnet pack zeeq-biome.slnx -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: biome-packages
          path: artifacts/*
          if-no-files-found: error

  # Build check only: the site is deployed from release.yml and docs.yml.
  docs:
    name: Build documentation
    uses: ./.github/workflows/docs-build.yml
